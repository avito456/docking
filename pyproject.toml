[project]
name = "doc-extract"
version = "0.1.0"
description = "Извлечение текста из Word/Excel/PDF и транскрибация аудио/видео в Markdown (docling)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "docling[asr]>=2.133.0",
    "mlx-whisper>=0.4.3",
    "questionary>=2.1.1",
    "rich>=15.0.0",
]

[project.scripts]
extract = "doc_extract.cli:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
